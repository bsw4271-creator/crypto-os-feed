# Hourly public briefing feed. Reads public market data only; no wallets or orders.
# The only key is a free Etherscan read-only API key (repo secret ETHERSCAN_API_KEY); it is never written to the feed.
# Cost: public repositories get free GitHub Actions minutes; one run takes about 1 minute.
name: feed
on:
  schedule:
    - cron: '17 * * * *' # minute 17 of every hour (UTC); GitHub may start it a few minutes late
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Build feed
        run: node feed.mjs --out feed
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      - name: Branch check (branch runs never commit)
        if: github.ref != 'refs/heads/main'
        run: |
          node -e "
          const a = JSON.parse(require('fs').readFileSync('feed/announcements.json','utf8'));
          const n = (m) => console.log('::notice::' + String(m).slice(0, 900));
          n('ok=' + a.sources_ok.join(',') + ' errors=' + JSON.stringify(a.errors) + ' items=' + a.items.length + ' coinbase_ids=' + a.coinbase_product_ids.length);
          for (const src of ['binance','bithumb','coinbase']) n(src + ': ' + JSON.stringify(a.items.filter(x => x.source === src).slice(0, 3).map(x => [x.kind, x.title, x.published_at, x.tickers, x.url])));
          "
      - name: Save feed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "crypto-os-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "피드 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
